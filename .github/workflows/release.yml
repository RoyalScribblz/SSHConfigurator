name: Release desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate version and check for an existing release
        id: validate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Enter a version in X.Y.Z format, without a leading v."
            exit 1
          fi
          tag="v$REQUESTED_VERSION"
          if gh release view "$tag" --json url --jq .url 2>/dev/null; then
            echo "::error::A GitHub Release already exists for $tag."
            exit 1
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    name: Package ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      APP_RID: ${{ matrix.rid }}
      APP_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained desktop app
        shell: bash
        run: |
          dotnet publish SSHConfigurator -c Release -r "$APP_RID" --self-contained true \
            -p:Version="$APP_VERSION" -o publish
      - name: Archive macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="publish/SSH Configurator.app"
          version="$APP_VERSION"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$bundle/Contents/Info.plist"
          test -x "$bundle/Contents/MacOS/SSHConfigurator"
          ditto -c -k --keepParent "$bundle" "SSHConfigurator-$RELEASE_TAG-$APP_RID.zip"
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "SSHConfigurator-$env:RELEASE_TAG-$env:APP_RID.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.rid }}
          path: SSHConfigurator-${{ needs.version.outputs.tag }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Create release with desktop archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if existing_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG already points to a different commit."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" --silent
          fi
          gh release create "$RELEASE_TAG" release/*.zip \
            --verify-tag --title "SSH Configurator $RELEASE_TAG" --generate-notes
